<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BuildMyCV app icon</title>
  <desc id="desc">Glossy cyan, blue and violet rounded square with a resume card, profile symbol, neon orbital ring and sparkles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d9ff"/>
      <stop offset=".42" stop-color="#087bff"/>
      <stop offset=".72" stop-color="#3428f4"/>
      <stop offset="1" stop-color="#c21cff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#d9dfff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00cfff"/>
      <stop offset=".58" stop-color="#187bff"/>
      <stop offset="1" stop-color="#c21cff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset=".5" stop-color="#53aaff"/>
      <stop offset="1" stop-color="#f052ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".18" r=".95">
      <stop offset="0" stop-color="#8ff6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8ff6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020b3b" flood-opacity=".48"/>
    </filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="900" x="62" y="62" rx="190"/></clipPath>
  </defs>
  <rect x="62" y="62" width="900" height="900" rx="190" fill="url(#bg)"/>
  <rect x="62" y="62" width="900" height="900" rx="190" fill="url(#glow)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="480" cy="480" rx="480" ry="430" fill="#1427b9" opacity=".22"/>
    <!-- layered resume sheets -->
    <g filter="url(#shadow)" opacity=".9">
      <path d="M190 414 Q183 386 213 373 L610 255 Q642 247 655 278 L804 737 Q815 770 780 782 L390 895 Q356 904 344 870 Z" fill="#46caff" fill-opacity=".56" stroke="#a7f4ff" stroke-opacity=".6" stroke-width="5"/>
      <path d="M154 493 Q146 464 178 451 L590 327 Q621 318 633 350 L760 771 Q771 802 738 813 L336 931 Q304 940 292 908 Z" fill="#627dff" fill-opacity=".62" stroke="#b8c5ff" stroke-opacity=".7" stroke-width="5"/>
    </g>
    <!-- neon orbital loop -->
    <path d="M125 735 C177 906 423 891 657 727 S910 461 783 370 C735 336 696 343 659 359" fill="none" stroke="#06dfff" stroke-width="25" stroke-linecap="round" opacity=".55" filter="url(#neon)"/>
    <path d="M125 735 C177 906 423 891 657 727 S910 461 783 370 C735 336 696 343 659 359" fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round"/>
    <!-- main document -->
    <g transform="rotate(-8 510 520)" filter="url(#shadow)">
      <path d="M260 244 Q260 204 300 204 H650 L760 314 V783 Q760 823 720 823 H300 Q260 823 260 783 Z" fill="url(#paper)" stroke="#ffffff" stroke-width="5"/>
      <path d="M650 204 V276 Q650 314 688 314 H760 Z" fill="#d5e8ff"/>
      <path d="M650 204 V276 Q650 314 688 314 H760" fill="none" stroke="#ffffff" stroke-width="5" opacity=".9"/>
      <!-- avatar -->
      <circle cx="405" cy="386" r="82" fill="#72e6ff" opacity=".68"/>
      <circle cx="405" cy="360" r="28" fill="#087cff"/>
      <path d="M360 426 Q365 388 405 388 Q445 388 450 426 Q450 443 432 443 H378 Q360 443 360 426Z" fill="#087cff"/>
      <!-- profile lines -->
      <rect x="510" y="333" width="116" height="31" rx="15.5" fill="#087cff"/>
      <rect x="510" y="383" width="143" height="27" rx="13.5" fill="#2858ff"/>
      <rect x="330" y="493" width="360" height="34" rx="17" fill="url(#line)"/>
      <rect x="335" y="555" width="340" height="22" rx="11" fill="#9bcaff"/>
      <rect x="335" y="600" width="270" height="22" rx="11" fill="#9bcaff"/>
      <rect x="335" y="645" width="310" height="22" rx="11" fill="#9bcaff"/>
      <rect x="335" y="704" width="150" height="30" rx="15" fill="url(#line)"/>
      <rect x="335" y="750" width="205" height="26" rx="13" fill="#2784ff"/>
    </g>
    <!-- sparkle accents -->
    <g fill="#ffffff" filter="url(#neon)">
      <path d="M825 540 L843 588 L891 606 L843 624 L825 672 L807 624 L759 606 L807 588 Z"/>
      <path d="M884 645 L895 674 L924 685 L895 696 L884 725 L873 696 L844 685 L873 674 Z"/>
    </g>
    <path d="M815 172 C840 247 870 276 941 294 C870 312 840 341 815 416 C790 341 760 312 689 294 C760 276 790 247 815 172Z" fill="#a4f8ff" opacity=".65"/>
  </g>
  <rect x="64" y="64" width="896" height="896" rx="188" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="4"/>
</svg>
